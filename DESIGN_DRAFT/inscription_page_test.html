<!-- Registration Card (Kinetic Glass Style) -->
<div class="relative w-full bg-surface-container-high/60 backdrop-blur-xl border border-white/10 rounded-xl p-lg md:p-xl shadow-[0_8px_32px_rgba(0,0,0,0.6)] overflow-hidden">

<div class="absolute top-0 left-0 w-32 h-32 bg-gradient-to-br from-white/10 to-transparent rounded-tl-xl pointer-events-none"></div>
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs tracking-tight">REJOIGNEZ<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-container to-secondary">L'ARÈNE</span></h1>
<p class="font-body-md text-body-md text-on-surface-variant">Créez votre compte SmartPronos 2026</p>
</div>
<!-- Registration Form -->
<form class="space-y-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="fullname">Nom complet</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-[48px] pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-outline/50 shadow-inner" id="fullname" name="fullname" placeholder="Ex: Kylian Mbappé" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="email">Adresse Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-[48px] pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-outline/50 shadow-inner" id="email" name="email" placeholder="champion@worldcup.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="password">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-[48px] pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-outline/50 shadow-inner" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>

<div class="pt-sm">
<button class="w-full bg-gradient-to-r from-primary-container to-secondary rounded-full py-[12px] font-stats-number text-stats-number text-on-primary-container uppercase shadow-[0_0_20px_rgba(0,85,255,0.2)] hover:shadow-[0_0_30px_rgba(65,229,108,0.4)] transition-shadow duration-300 flex items-center justify-center gap-sm" type="submit">
                        CRÉER MON COMPTE
                        <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
</button>
</div>
