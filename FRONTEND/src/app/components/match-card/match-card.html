<div
  [routerLink]="['/match', match().id, 'prediction-form']"
  class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 cursor-pointer hover:border-tribbo-primary hover:shadow-md transition-all h-full flex flex-col relative overflow-hidden"
>
  <!-- Halo de fond -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(29,77,255,0.12)_0%,_rgba(29,77,255,0.07)_50%,_transparent_85%)] pointer-events-none"></div>
  <!-- Header -->
  <div class="flex items-center justify-between mb-4 text-xs text-gray-500 font-inter font-medium">
    <span class="flex items-center gap-1.5">📅 {{ match().kickoff | date:'dd MMM yyyy - HH:mm' }}</span>
    <span class="bg-gray-50 px-2.5 py-1 rounded-full">{{ match().stage }}</span>
  </div>

  <!-- Teams -->
  <div class="flex items-center justify-between flex-1">
    <div class="flex flex-col items-center gap-2 flex-1">
      <img [src]="match().homeTeam.flagUrl || ''" class="w-12 h-12 rounded-full object-cover" alt="" />
      <span class="font-archivo text-sm text-tribbo-text text-center leading-tight">{{ match().homeTeam.name }}</span>
    </div>
    <div class="px-3 font-space text-gray-300 font-bold text-xl">VS</div>
    <div class="flex flex-col items-center gap-2 flex-1">
      <img [src]="match().awayTeam.flagUrl || ''" class="w-12 h-12 rounded-full object-cover" alt="" />
      <span class="font-archivo text-sm text-tribbo-text text-center leading-tight">{{ match().awayTeam.name }}</span>
    </div>
  </div>

  <!-- CTA -->
  <div class="mt-5 pt-4 border-t border-gray-100">
    <button class="w-full bg-tribbo-primary text-white font-inter font-semibold text-sm py-3 rounded-xl shadow-sm hover:bg-blue-700 hover:shadow-md transition-all active:scale-[0.98]">
      Pronostiquer
    </button>
  </div>
</div>
