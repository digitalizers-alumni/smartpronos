<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col items-center gap-6">
  <div class="font-inter text-gray-500 text-sm flex items-center gap-2">
    Votre pronostic
  </div>

  <div class="flex items-center justify-center gap-6 w-full">
    <div class="flex flex-col items-center gap-2">
      <input
        #homeScoreInput
        type="number"
        formControlName="homeScore"
        [min]="minScore"
        [max]="maxScore"
        (focus)="selectInputContent($event)"
        (click)="selectInputContent($event)"
        class="w-24 h-24 bg-gray-50 border-2 border-gray-200 rounded-xl text-center font-space text-4xl font-bold text-tribbo-text shadow-inner focus:border-tribbo-primary focus:ring-2 focus:ring-tribbo-primary/10 focus:outline-none transition-all [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
      />
      <span class="font-archivo text-xs text-gray-400 uppercase">{{ homeTeam().name }}</span>
    </div>

    <span class="font-space text-gray-300 font-bold text-2xl">-</span>

    <div class="flex flex-col items-center gap-2">
      <input
        type="number"
        formControlName="awayScore"
        [min]="minScore"
        [max]="maxScore"
        (focus)="selectInputContent($event)"
        (click)="selectInputContent($event)"
        class="w-24 h-24 bg-gray-50 border-2 border-gray-200 rounded-xl text-center font-space text-4xl font-bold text-tribbo-text shadow-inner focus:border-tribbo-primary focus:ring-2 focus:ring-tribbo-primary/10 focus:outline-none transition-all [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
      />
      <span class="font-archivo text-xs text-gray-400 uppercase">{{ awayTeam().name }}</span>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 rounded-xl bg-white/80 px-4 py-2.5 shadow-sm ring-1 ring-gray-100">
    <span class="font-inter text-xs font-bold text-emerald-600">🎯 Score exact = 5 pts</span>
    <span class="hidden h-4 w-px bg-gray-200 sm:block"></span>
    <span class="font-inter text-xs font-bold text-tribbo-primary">🛡️ Bon vainqueur = 2 pts</span>
  </div>

  @if (formError(); as message) {
    <div class="w-full rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-center">
      <p class="font-inter text-sm font-semibold text-red-600">{{ message }}</p>
    </div>
  }

  <button
    type="submit"
    [disabled]="submitting() || disabled()"
    class="w-full md:max-w-xs md:mx-auto bg-tribbo-primary text-white font-inter font-semibold py-4 rounded-xl shadow-[0_4px_14px_0_rgba(29,77,255,0.39)] active:scale-95 transition-all hover:brightness-110 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:shadow-none"
  >
    {{ submitting() ? 'Validation...' : submitLabel() }}
  </button>
</form>
