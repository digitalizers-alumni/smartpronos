<div class="h-screen w-full flex flex-col bg-tribbo-bg">
  <!-- Desktop Top Navigation Bar -->
  @if (showAppChrome()) {
    <header class="fixed top-0 left-0 right-0 z-40 hidden md:flex h-16 bg-tribbo-surface border-b border-gray-200 items-center px-6 justify-between shrink-0">
      <a (click)="navigateTo('/home/match-list')" class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity">
        <img src="assets/logo-tribbo-mark.svg" class="w-10 h-10 object-contain" alt="Tribbo" />
        <span class="font-archivo text-lg text-tribbo-text uppercase tracking-tight">Tribbo</span>
      </a>
      <nav class="flex items-center gap-1">
        <a (click)="navigateTo('/home/match-list')"
           class="px-4 py-2 rounded-lg text-sm font-inter cursor-pointer transition-colors hover:text-gray-700 hover:bg-gray-50"
           [class.text-tribbo-primary]="isActive('/home/match-list')"
           [class.font-semibold]="isActive('/home/match-list')"
           [class.bg-tribbo-primary/5]="isActive('/home/match-list')"
           [class.text-gray-500]="!isActive('/home/match-list')"
        >Accueil</a>
         <a (click)="navigateTo('/leaderboard')"
            class="px-4 py-2 rounded-lg text-sm font-inter cursor-pointer transition-colors hover:text-gray-700 hover:bg-gray-50"
            [class.text-tribbo-primary]="isActive('/leaderboard')"
            [class.font-semibold]="isActive('/leaderboard')"
            [class.bg-tribbo-primary/5]="isActive('/leaderboard')"
            [class.text-gray-500]="!isActive('/leaderboard')"
         >Classement</a>
         <a (click)="navigateTo('/tribe')"
            class="px-4 py-2 rounded-lg text-sm font-inter cursor-pointer transition-colors hover:text-gray-700 hover:bg-gray-50"
            [class.text-tribbo-primary]="isActive('/tribe')"
            [class.font-semibold]="isActive('/tribe')"
            [class.bg-tribbo-primary/5]="isActive('/tribe')"
            [class.text-gray-500]="!isActive('/tribe')"
         >Tribu</a>
      </nav>
      <div class="relative" (click)="keepUserMenuOpen($event)">
        <button
          type="button"
          (click)="toggleUserMenu()"
          class="w-9 h-9 flex items-center justify-center rounded-full text-gray-400 hover:text-tribbo-primary hover:bg-tribbo-primary/5 transition-colors"
          aria-label="Menu utilisateur"
        >
          <span class="material-symbols-outlined text-xl">emoji_events</span>
        </button>
        @if (userMenuOpen()) {
          <div class="absolute right-0 top-11 z-50 w-44 rounded-2xl border border-gray-100 bg-white p-2 shadow-lg">
            <button
              type="button"
              (click)="navigateTo('/profile')"
              class="w-full rounded-xl px-3 py-2 text-left font-inter text-sm font-semibold text-tribbo-text hover:bg-gray-50 transition-colors"
            >
              Profil
            </button>
            <button
              type="button"
              (click)="signOut()"
              class="w-full rounded-xl px-3 py-2 text-left font-inter text-sm font-semibold text-red-500 hover:bg-red-50 transition-colors"
            >
              Se déconnecter
            </button>
          </div>
        }
      </div>
    </header>
  }

  <!-- Mobile TopAppBar -->
  @if (showAppChrome()) {
    <div class="fixed top-0 left-0 right-0 z-40 flex md:hidden shrink-0">
      <app-top-app-bar />
    </div>
  }

  @if (showAppChrome()) {
    <div class="fixed left-0 right-0 top-14 md:top-16 z-30 h-5 bg-gray-200">
      <div
        class="h-full bg-tribbo-primary transition-all duration-300 ease-out"
        [style.width.%]="predictionProgress.widthPercent()"
      ></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="font-space text-[10px] font-bold text-tribbo-text">
          {{ predictionProgress.label() }}
        </span>
      </div>
    </div>
  }

  <!-- Scrollable Content Area -->
  <main class="flex-1 overflow-y-auto overflow-x-hidden"
        [class.pt-20]="showAppChrome()"
        [class.md:pt-24]="showAppChrome()"
        [class.pb-16]="showAppChrome()"
        [class.md:pb-0]="showAppChrome()">
    <div class="mx-auto w-full"
         [class.md:max-w-7xl]="showAppChrome() && !isPredictionFormScreen()">
      <router-outlet />
    </div>


  </main>

  <!-- Desktop Footer -->
  @if (showAppChrome()) {
    <footer class="hidden md:flex shrink-0 h-14 bg-tribbo-surface border-t border-gray-200 items-center justify-center gap-2 z-10">
      <span class="font-inter text-[10px] text-gray-400 tracking-[4px] uppercase">by</span>
      <a
        href="https://digitalizers.ch"
        target="_blank"
        rel="noopener noreferrer"
        class="opacity-40 transition-opacity hover:opacity-70"
        aria-label="Ouvrir le site Digitalizers"
      >
        <img src="assets/logo-digitalizers-grey.png" class="h-5" alt="Digitalizers" />
      </a>
    </footer>
  }

  <!-- Mobile Bottom Navigation (fixed at bottom) -->
  @if (showAppChrome()) {
    <nav class="fixed bottom-0 left-0 right-0 z-50 flex md:hidden">
      <app-bottom-nav />
    </nav>
  }
</div>
