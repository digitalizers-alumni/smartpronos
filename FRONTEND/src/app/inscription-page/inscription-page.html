<main class="inscription-page">
  <div
    class="background-stadium"
    role="img"
    aria-label="A wide-angle, hyper-realistic view of a massive football stadium at night."
  >
    <div class="background-overlay"></div>
  </div>

  <section class="content-canvas">
    <div class="registration-card">
      <div class="glass-highlight"></div>

      <header class="header-section">
        <h1>
          REJOIGNEZ
          <br />
          <span>L'ARÈNE</span>
        </h1>
        <p>Créez votre compte SmartPronos 2026</p>
      </header>

      <form class="registration-form" (submit)="onSubmit($event)">
        <div class="input-group">
          <label for="fullname">Nom complet</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">person</span>
            <input
              id="fullname"
              name="fullname"
              type="text"
              placeholder="Ex: Kylian Mbappé"
              autocomplete="name"
            />
          </div>
        </div>

        <div class="input-group">
          <label for="email">Adresse Email</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="champion@worldcup.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              id="password"
              name="password"
              [type]="isPasswordVisible ? 'text' : 'password'"
              placeholder="••••••••"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="
                isPasswordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
            >
              <span class="material-symbols-outlined">
                {{ isPasswordVisible ? 'visibility' : 'visibility_off' }}
              </span>
            </button>
          </div>
        </div>

        <div class="submit-container">
          <button type="submit" class="submit-btn">
            CRÉER MON COMPTE
            <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
          </button>
        </div>
      </form>

      <div class="divider" aria-hidden="true">
        <div class="line"></div>
        <span>Ou</span>
        <div class="line"></div>
      </div>

      <div class="social-signup">
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            ></path>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="apple-svg">
            <path
              d="M16.365 7.022c-.015.01-.035.015-.05.025-1.57.805-2.585 2.45-2.585 4.31 0 2.505 1.95 4.415 4.355 4.675-.025.075-.05.15-.08.225-1.07 3.12-3.32 6.745-6.025 6.745-1.22 0-2.455-.77-3.905-.77-1.42 0-2.64.765-3.9.765C1.65 23 0 18.235 0 13.91c0-4.04 2.22-7.39 5.6-7.39 1.41 0 2.65.75 3.93.75 1.25 0 2.45-.75 3.92-.75.98 0 1.96.22 2.915.5zM11.53.003c.01-.002.025-.003.04-.003C13.882 0 16.03 2.102 16.03 4.406c0 2.3-2.148 4.405-4.46 4.405-.01 0-.025 0-.04-.002C9.218 8.81 7.07 6.708 7.07 4.404 7.07 2.102 9.218 0 11.53 0z"
            ></path>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <footer class="card-footer">
        <p>
          Déjà un compte ?
          <a routerLink="/login">Se connecter</a>
        </p>
      </footer>
    </div>
  </section>
</main>
