<div class="flex flex-col h-full w-full bg-tribbo-bg px-8 py-12 md:py-16">
  <div class="flex flex-col w-full max-w-sm mx-auto flex-1">
    <!-- Header -->
    <div class="flex flex-col items-center mb-10">
      <button routerLink="/" class="mb-8 hover:opacity-80 transition-opacity">
        <img src="assets/logo-tribbo.png" class="w-14 h-14 object-contain" alt="Tribbo" />
      </button>
      <h1 class="font-archivo text-3xl md:text-4xl text-tribbo-text uppercase tracking-tight text-center leading-tight">
        Créer un<br />compte
      </h1>
      <div class="h-1 w-12 bg-tribbo-primary mt-4 rounded-full"></div>
    </div>

    <!-- Form -->
    <form [formGroup]="signupForm" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
            Prénom
          </label>
          <input
            type="text"
            formControlName="fullname"
            placeholder="JEAN"
            class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm text-tribbo-text placeholder:text-gray-200 focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
            required
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
            Nom
          </label>
          <input
            type="text"
            placeholder="DUPONT"
            class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm text-tribbo-text placeholder:text-gray-200 focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
          Email professionnel
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="JEAN.DUPONT@DIGITALIZERS.FR"
          class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm text-tribbo-text placeholder:text-gray-200 focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
          required
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
          Mot de passe
        </label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••••••"
          class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm text-tribbo-text placeholder:text-gray-200 focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
          required
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
          Confirmer le mot de passe
        </label>
        <input
          type="password"
          placeholder="••••••••••••"
          class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm text-tribbo-text placeholder:text-gray-200 focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3">
          <p class="font-inter text-xs text-red-600">{{ errorMessage() }}</p>
        </div>
      }

      <button
        type="submit"
        class="w-full bg-tribbo-primary text-white font-archivo text-sm uppercase tracking-wider py-5 rounded-xl shadow-[0_12px_28px_-8px_rgba(29,77,255,0.4)] active:scale-[0.98] transition-all hover:brightness-110 mt-2"
      >
        Créer mon compte
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-auto pt-10 flex flex-col items-center">
      <button
        routerLink="/login"
        class="font-space text-[11px] uppercase tracking-tight text-gray-400 group"
      >
        Déjà inscrit&nbsp;?
        <span class="text-tribbo-primary font-bold group-hover:underline">Se connecter</span>
      </button>
    </div>
  </div>
</div>
