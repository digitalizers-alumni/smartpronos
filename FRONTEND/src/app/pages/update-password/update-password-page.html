<div class="flex flex-col h-full w-full bg-tribbo-bg px-8 py-12 md:py-16">
  <div class="flex flex-col w-full max-w-sm mx-auto flex-1">
    <div class="flex flex-col items-center mb-10">
      <button routerLink="/" class="mb-8 hover:opacity-80 transition-opacity">
        <img src="assets/logo-tribbo-mark.svg" class="w-14 h-14 object-contain" alt="Tribbo" />
      </button>
      <h1 class="font-archivo text-3xl text-tribbo-text uppercase tracking-tight text-center leading-tight">
        Nouveau mot de passe
      </h1>
      <div class="h-1 w-12 bg-tribbo-primary mt-4 rounded-full"></div>
    </div>

    @if (expired()) {
      <div class="flex flex-col items-center gap-6 py-8">
        <span class="text-6xl">🔗</span>
        <p class="font-inter text-sm text-gray-500 text-center leading-relaxed">
          Lien invalide ou expiré.<br />Demande un nouveau lien.
        </p>
        <a routerLink="/login"
          class="font-space text-[11px] uppercase tracking-tight text-tribbo-primary font-bold hover:underline">
          Retour à la connexion
        </a>
      </div>
    } @else if (success()) {
      <div class="flex flex-col items-center gap-6 py-8">
        <span class="text-6xl">✅</span>
        <p class="font-inter text-sm text-gray-500 text-center leading-relaxed">
          Mot de passe mis à jour !<br />Redirection vers la connexion...
        </p>
      </div>
    } @else if (ready()) {
      <form (ngSubmit)="submit()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
            Nouveau mot de passe
          </label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="••••••••••••"
            class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
            required
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-space text-[11px] uppercase tracking-widest text-gray-400 font-bold">
            Confirmer le mot de passe
          </label>
          <input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••••••"
            class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 font-inter text-sm focus:outline-none focus:border-tribbo-primary focus:ring-4 focus:ring-tribbo-primary/5 transition-all shadow-sm"
            required
          />
        </div>

        @if (error()) {
          <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3">
            <p class="font-inter text-xs text-red-600">{{ error() }}</p>
          </div>
        }

        <button type="submit" [disabled]="submitting()"
          class="w-full bg-tribbo-primary text-white font-archivo text-sm uppercase tracking-wider py-5 rounded-xl shadow-[0_12px_28px_-8px_rgba(29,77,255,0.4)] active:scale-[0.98] transition-all hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed">
          @if (submitting()) {
            Mise à jour...
          } @else {
            Enregistrer
          }
        </button>
      </form>
    }
  </div>
</div>
