<div class="flex flex-col h-full w-full bg-tribbo-bg px-4 py-6 md:px-8 md:py-8 space-y-6 md:space-y-8">
  <!-- Stats Bar -->
  <div class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-gray-100">
    <div class="flex items-center justify-between">
      <div>
        <p class="font-inter text-sm text-gray-500 font-medium">Mes points</p>
        <div class="font-space text-3xl md:text-4xl font-bold text-tribbo-text mt-1">1,240</div>
      </div>
      <div class="text-right">
        <p class="font-inter text-sm text-gray-500 font-medium">Classement</p>
        <div class="font-space text-2xl md:text-3xl font-bold text-tribbo-primary mt-1">#4</div>
      </div>
    </div>
  </div>

  <!-- Filter Buttons -->
  <div class="flex gap-2 overflow-x-auto pb-1">
    @for (f of filters; track f.value) {
      <button
        (click)="setFilter(f.value)"
        class="px-5 py-2.5 rounded-full text-sm font-inter font-medium transition-colors whitespace-nowrap"
        [class.bg-tribbo-primary]="isFilterActive(f.value)"
        [class.text-white]="isFilterActive(f.value)"
        [class.bg-gray-100]="!isFilterActive(f.value)"
        [class.text-gray-500]="!isFilterActive(f.value)"
      >
        {{ f.label }}
      </button>
    }
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="flex items-center justify-center py-16">
      <div class="font-inter text-gray-400 text-sm">Chargement...</div>
    </div>
  }

  <!-- Match Grid -->
  @if (!loading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
      @for (group of dateGroups(); track group.dateKey) {
        @for (match of group.matches; track match.id) {
          <app-match-card [match]="match" />
        }
      }
    </div>

    @if (dateGroups().length === 0) {
      <div class="flex flex-col items-center justify-center py-16">
        <div class="font-inter text-gray-400 text-sm">Aucun match trouvé</div>
      </div>
    }
  }
</div>
