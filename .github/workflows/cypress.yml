name: Cypress Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: FRONTEND

      - name: Build Angular
        run: npm run build
        working-directory: FRONTEND

      - name: Install serve + wait-on
        run: npm install -g serve wait-on

      - name: Start app
        run: serve FRONTEND/dist/browser -l 4200 --single &

      - name: Wait for app
        run: wait-on http://localhost:4200 --timeout 60000

      - name: Run Cypress
        run: npx cypress run
        working-directory: FRONTEND